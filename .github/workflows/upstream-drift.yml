name: upstream-drift

# Answers "has the api plugin moved?" — deliberately separate from ci, which
# answers "is this code good?". A red run here means a new api plugin release
# needs triage. The full runbook lives in CLAUDE.md, "Keeping current with
# grav-plugin-api".

on:
  schedule:
    - cron: '17 6 * * 1'  # weekly, Monday 06:17 UTC
  workflow_dispatch:

jobs:
  param-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check out the latest released api plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api repos/getgrav/grav-plugin-api/releases/latest --jq .tag_name)
          echo "latest release: $TAG — last triaged: $(cat tests/api-plugin.pin)"
          git clone --depth 1 -b "$TAG" https://github.com/getgrav/grav-plugin-api /tmp/grav-plugin-api

      - run: API_PLUGIN_DIR=/tmp/grav-plugin-api php tests/param-map.php
